    <script>
        (function() {
            var htmlClass = document.documentElement.classList;
            setTimeout(function() { htmlClass.remove('not-ready'); }, 10);

            var defaultMode = 'auto';
            var darkScheme  = window.matchMedia('(prefers-color-scheme: dark)');

            function setDark(isDark) {
                htmlClass[isDark ? 'add' : 'remove']('dark');
                try { localStorage.setItem('paper-dark', isDark); } catch(e) {}
            }

            var stored = null;
            try { stored = localStorage.getItem('paper-dark'); } catch(e) {}
            if (stored === 'true' || stored === 'false') {
                setDark(stored === 'true');
            } else if (defaultMode === 'dark')  { setDark(true);  }
            else if  (defaultMode === 'light') { setDark(false); }
            else { setDark(darkScheme.matches); }

            darkScheme.addEventListener('change', function(e) {
                var s = null; try { s = localStorage.getItem('paper-dark'); } catch(err) {}
                if (s === null) setDark(e.matches);
            });

            var btnDark = document.querySelector('.theme-toggle');
            if (btnDark) btnDark.addEventListener('click', function() {
                setDark(!htmlClass.contains('dark'));
            });

            var btnMenu = document.querySelector('.menu-toggle');
            if (btnMenu) btnMenu.addEventListener('click', function() {
                htmlClass.toggle('menu-open');
            });
        })();
    </script>
